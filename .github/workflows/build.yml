name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux-artifacts:
    needs: [lint, ktlint]
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - uses: actions/checkout@v6

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Linux
        run: ./gradlew packageDeb packageRpm packageAppImage

      - name: Build Android
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: KadePay-Android-Debug
          path: ./composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: KadePay-Android-Unsigned-Release
          path: ./composeApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Linux Debian
        uses: actions/upload-artifact@v7
        with:
          name: KadePay-Linux-Deb
          path: ./composeApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

      - name: Upload Linux RPM
        uses: actions/upload-artifact@v7
        with:
          name: KadePay-Linux-RPM
          path: ./composeApp/build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: error

      - name: Package AppImage Zip
        run: |
          cd ./composeApp/build/compose/binaries/main/app/
          zip -r com.kade.pay.zip com.kade.pay

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v7
        with:
          name: KadePay-Linux-AppImage
          path: ./composeApp/build/compose/binaries/main/app/*.zip
          if-no-files-found: error

  macos-artifacts:
    needs: [lint, ktlint]
    runs-on: macos-latest
    environment: Development
    steps:
      - uses: actions/checkout@v6

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew packageDmg

      - name: Upload Dmg
        uses: actions/upload-artifact@v7
        with:
          name: KadePay-macOS-DMG
          path: ./composeApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

  windows-artifacts:
    needs: [lint, ktlint]
    runs-on: windows-latest
    environment: Development
    steps:
      - uses: actions/checkout@v6

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew packageMsi packageExe

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: KadePay-Windows-MSI
          path: ./composeApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: KadePay-Windows-EXE
          path: ./composeApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

  lint:
    environment: Development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run linter
        run: ./gradlew lint

      - uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: ./composeApp/build/reports/*.html

  ktlint:
    environment: Development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Kotlin linter
        run: ./gradlew ktlintCheck
