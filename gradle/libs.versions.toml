ktlintGradle = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidxRoom = { id = "androidx.room", version.ref = "room" }
googleProtobuf = { id = "com.google.protobuf", version.ref = "protobuf" }
squareWire = { id = "com.squareup.wire", version.ref = "squareWire" }